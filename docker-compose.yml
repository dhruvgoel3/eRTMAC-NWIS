version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: nwis-postgres
    restart: always
    environment:
      POSTGRES_USER: nwis_user
      POSTGRES_PASSWORD: nwis_password
      POSTGRES_DB: nwis_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nwis_user -d nwis_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nwis-backend
    restart: always
    environment:
      DATABASE_URL: postgresql://nwis_user:nwis_password@db:5432/nwis_db
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      FRONTEND_URL: http://localhost:5173
      BACKEND_URL: http://localhost:8000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python seed/seed_data.py && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nwis-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
